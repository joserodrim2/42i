name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, unit & e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/tasks?schema=public
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose — full stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::API did not become healthy in time"
          docker compose logs
          exit 1
      - name: Web app is served
        run: curl -fsS -o /dev/null http://localhost:8080
      - name: API is reachable through the web proxy
        run: curl -fsS http://localhost:8080/api/tasks/stats
      - name: Tear down
        if: always()
        run: docker compose down -v
